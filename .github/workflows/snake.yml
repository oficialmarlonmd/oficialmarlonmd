name: Generate Snake
on:
  schedule: [{cron: "0 0 * * *"}] # Roda automaticamente todo dia à meia-noite
  workflow_dispatch: # Permite que você rode manualmente quando quiser
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
